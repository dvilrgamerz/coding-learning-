<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720">
<rect width="1280" height="720" fill="#08111d"/>
<text x="70" y="72" fill="#45e0ff" font-family="Arial" font-size="26" font-weight="700">PREDICTION TIME</text>
<text x="70" y="132" fill="#fff" font-family="Arial" font-size="46" font-weight="700">What will this print?</text>
