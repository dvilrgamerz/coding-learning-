<text x="118" y="350" fill="#c792ea" font-family="monospace" font-size="38">print</text>
<text x="238" y="350" fill="#e6edf3" font-family="monospace" font-size="38">("Hello" + " Python")</text>
<text x="70" y="590" fill="#92a8bb" font-family="Arial" font-size="24">Pause and predict before seeing the answer.</text>
<text x="70" y="645" fill="#5ee08b" font-family="Arial" font-size="26" font-weight="700">Answer: Hello Python</text>
